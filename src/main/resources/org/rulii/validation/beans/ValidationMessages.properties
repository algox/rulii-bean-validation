# Default messages of the jakarta.validation constraints and of this library's own constraints, keyed by
# the constraint's default message template key. A ValidationMessages.properties bundle at the root of the
# classpath (the name the Bean Validation specification reserves for user messages) overrides any entry here;
# for the library's constraints the same key under the org.hibernate.validator.constraints prefix is honoured
# there as well, so overrides written for that provider carry over.
jakarta.validation.constraints.AssertFalse.message     = must be false
jakarta.validation.constraints.AssertTrue.message      = must be true
jakarta.validation.constraints.DecimalMax.message      = must be less than ${inclusive == true ? 'or equal to ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message      = must be greater than ${inclusive == true ? 'or equal to ' : ''}{value}
jakarta.validation.constraints.Digits.message          = numeric value out of bounds (<{integer} digits>.<{fraction} digits> expected)
jakarta.validation.constraints.Email.message           = must be a well-formed email address
jakarta.validation.constraints.Future.message          = must be a future date
jakarta.validation.constraints.FutureOrPresent.message = must be a date in the present or in the future
jakarta.validation.constraints.Max.message             = must be less than or equal to {value}
jakarta.validation.constraints.Min.message             = must be greater than or equal to {value}
jakarta.validation.constraints.Negative.message        = must be less than 0
jakarta.validation.constraints.NegativeOrZero.message  = must be less than or equal to 0
jakarta.validation.constraints.NotBlank.message        = must not be blank
jakarta.validation.constraints.NotEmpty.message        = must not be empty
jakarta.validation.constraints.NotNull.message         = must not be null
jakarta.validation.constraints.Null.message            = must be null
jakarta.validation.constraints.Past.message            = must be a past date
jakarta.validation.constraints.PastOrPresent.message   = must be a date in the past or in the present
jakarta.validation.constraints.Pattern.message         = must match "{regexp}"
jakarta.validation.constraints.Positive.message        = must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message  = must be greater than or equal to 0
jakarta.validation.constraints.Size.message            = must be between {min} and {max}

org.rulii.validation.beans.constraints.Length.message           = length must be between {min} and {max}
org.rulii.validation.beans.constraints.Range.message            = must be between {min} and {max}
org.rulii.validation.beans.constraints.URL.message              = must be a valid URL
org.rulii.validation.beans.constraints.UUID.message             = must be a valid UUID
org.rulii.validation.beans.constraints.CreditCardNumber.message = invalid credit card number
org.rulii.validation.beans.constraints.LuhnCheck.message        = the check digit for ${validatedValue} is invalid, Luhn Modulo 10 checksum failed
org.rulii.validation.beans.constraints.Mod10Check.message       = the check digit for ${validatedValue} is invalid, Modulo 10 checksum failed
org.rulii.validation.beans.constraints.Mod11Check.message       = the check digit for ${validatedValue} is invalid, Modulo 11 checksum failed
org.rulii.validation.beans.constraints.EAN.message              = invalid {type} barcode
org.rulii.validation.beans.constraints.ISBN.message             = invalid ISBN
org.rulii.validation.beans.constraints.UniqueElements.message   = must only contain unique elements
org.rulii.validation.beans.constraints.Normalized.message       = must be normalized
org.rulii.validation.beans.constraints.CodePointLength.message  = length must be between {min} and {max}
org.rulii.validation.beans.constraints.time.DurationMin.message = must ${inclusive == true ? 'not be shorter than' : 'be longer than'} {min}
org.rulii.validation.beans.constraints.time.DurationMax.message = must ${inclusive == true ? 'not be longer than' : 'be shorter than'} {max}

org.rulii.validation.beans.constraints.Alpha.message        = must contain only letters
org.rulii.validation.beans.constraints.AlphaNumeric.message = must contain only letters and digits
org.rulii.validation.beans.constraints.Numeric.message      = must contain only digits
org.rulii.validation.beans.constraints.Decimal.message      = must be a decimal number
org.rulii.validation.beans.constraints.Ascii.message        = must contain only ASCII characters
org.rulii.validation.beans.constraints.LowerCase.message    = must be in lower case
org.rulii.validation.beans.constraints.UpperCase.message    = must be in upper case
org.rulii.validation.beans.constraints.StartsWith.message   = must start with one of {value}
org.rulii.validation.beans.constraints.EndsWith.message     = must end with one of {value}
org.rulii.validation.beans.constraints.In.message           = must be one of {value}
