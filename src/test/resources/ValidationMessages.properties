# The user's bundle (test fixture): overrides a standard key and defines custom keys.
jakarta.validation.constraints.Null.message = must be absent
my.key    = custom text
my.sized  = must be between {min} and {max} characters
my.nested = nested {my.key}
my.loop   = loop {my.loop}
my.quoted = it's {min}
org.hibernate.validator.constraints.Range.message = reference range override {min}-{max}
